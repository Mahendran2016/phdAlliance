[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-xdl"
version = "0.1.0"
description = "Regime-Switching Explainable Deep Learning for the Nifty 50"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "hmmlearn>=0.3.2",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.2",
  "xgboost>=2.0",
  "yfinance>=0.2.40",
]

[project.scripts]
rsxdl = "rsxdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
